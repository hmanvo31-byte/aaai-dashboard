name: Build design tokens

# Runs whenever Tokens Studio pushes new token JSON to /tokens,
# rebuilds tokens.css, and commits the result — so the live dashboard
# always reflects the latest values from Figma.
on:
  push:
    paths:
      - "tokens/**"
      - "style-dictionary.config.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Style Dictionary
        run: npm install

      - name: Build tokens.css from /tokens
        run: npm run build

      - name: Commit tokens.css if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens.css
          git diff --staged --quiet || git commit -m "chore: rebuild tokens.css from Figma tokens [skip ci]"
          git push
