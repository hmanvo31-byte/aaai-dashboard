name: Build design tokens

on:
  push:
    paths:
      - "tokens/**"
      - "style-dictionary.config.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Style Dictionary
        run: npm install

      - name: Build tokens.css from /tokens
        run: npm run build

      - name: Commit tokens.css if it
